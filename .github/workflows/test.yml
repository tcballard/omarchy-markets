name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.14"
      - name: Validate workflows with pinned actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run portable contract, provider, model, lifecycle, and fixture checks
        run: ./tests/run
      - name: Reject whitespace errors
        run: git diff --check
  qml:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - name: Install Qt Quick Test
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qt6-declarative-dev-tools qml6-module-qttest \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtqml \
            qml6-module-qtqml-models qml6-module-qtqml-workerscript
      - name: Load QML and exercise chart and panel interactions
        run: ./tests/qml/run
  qml-qt612:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Qt graphics runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0
      - name: Install pinned Qt 6.12 runtime and Qt Quick Test
        run: python3 -m pip install PySide6-Essentials==6.12.0 shiboken6==6.12.0
      - name: Load QML and exercise chart and panel interactions on Qt 6.12
        env:
          QMLTESTRUNNER: ./tests/qml/pyside-runner
          EXPECTED_QT_VERSION: "6.12.0"
        run: ./tests/qml/run
  candidate:
    needs: [workflows, portable, qml, qml-qt612]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Package the exact tested source without host acceptance
        run: python3 .github/scripts/release.py build "$RUNNER_TEMP/markets-candidate"
      - name: Upload source candidate for desktop testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markets-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/markets-candidate/
          retention-days: 14
