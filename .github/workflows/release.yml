name: Release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markets-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate exact release source
        run: |
          ./tests/run
          git diff --check
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Build, tag and publish immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          tag="v$version"
          notes="docs/releases/$tag.md"
          test -f "$notes"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          else
            git tag -a "$tag" "$GITHUB_SHA" -m "Omarchy Markets $tag"
            git push origin "refs/tags/$tag"
          fi
          python3 .github/scripts/release.py build "$RUNNER_TEMP/markets-release"
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state"; then
            if test "$(cat "$RUNNER_TEMP/release-state")" = false; then
              gh release download "$tag" --dir "$RUNNER_TEMP/markets-downloaded"
              python3 .github/scripts/release.py verify "$RUNNER_TEMP/markets-downloaded"
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Omarchy Markets $tag" --notes-file "$notes"
          fi
          gh release upload "$tag" "$RUNNER_TEMP/markets-release/"* --clobber
          gh release download "$tag" --dir "$RUNNER_TEMP/markets-downloaded"
          python3 .github/scripts/release.py verify "$RUNNER_TEMP/markets-downloaded"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          gh release edit "$tag" --draft=false --latest
